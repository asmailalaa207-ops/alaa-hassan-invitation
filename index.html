<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080706">
<meta property="og:title" content="دعوة الاء وحسن | خطوبة وعقد قران">
<meta property="og:description" content="اضغط لفتح الدعوة">
<title>الاء & حسن | خطوبة وعقد قران</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap');
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#050403;color:#e7c77b}
body{font-family:Amiri,serif;overflow-x:hidden}
button{font:inherit}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative;background:
radial-gradient(circle at 50% 35%,#241b10 0,#0d0a07 38%,#030303 78%)}
.page:before{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(#d8b66a .7px,transparent .7px);background-size:34px 34px;pointer-events:none}
.wrap{width:min(92vw,430px);position:relative}
.envelope{height:290px;position:relative;display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 24px 28px #000)}
.envelope:focus{outline:3px solid rgba(231,199,123,.45);outline-offset:6px}
.open-fallback{display:block;text-align:center;margin:18px auto 0;padding:10px 24px;border:1px solid #b88b40;border-radius:999px;background:#0b0907;color:#e7c77b;font-family:Cairo,sans-serif;font-size:15px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.open-fallback:active{transform:scale(.97)}
.body{position:absolute;inset:0;border:2px solid #b68a3e;border-radius:10px;background:linear-gradient(145deg,#1d1710,#080706);box-shadow:inset 0 0 0 5px #100d09,inset 0 0 30px #000}
.body:after{content:"";position:absolute;inset:11px;border:1px solid #765727;border-radius:6px}
.flap{position:absolute;z-index:5;left:0;top:0;width:100%;height:69%;background:linear-gradient(145deg,#302417,#0b0907);clip-path:polygon(0 0,100% 0,50% 100%);border-top:2px solid #d0a75a;transform-origin:top;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.seal{position:absolute;z-index:6;left:50%;top:44%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:2px solid #d7b05f;background:#17100a;display:flex;align-items:center;justify-content:center;color:#e8c97e;font-size:22px;transition:opacity .4s}
.seal:before{content:"";position:absolute;inset:5px;border:1px solid #8f6a31;border-radius:50%}
.ribbon{position:absolute;left:7%;right:7%;bottom:18%;height:1px;background:#a77c34;box-shadow:0 0 0 1px #241b0e}
.hint{text-align:center;margin-top:28px;font-size:17px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.52;transform:translateY(3px)}}
.card{display:none;min-height:100vh;padding:22px 12px;background:#050403}
.card.open{display:block}
.card-inner{max-width:520px;margin:auto;min-height:calc(100vh - 44px);padding:42px 24px 38px;border:2px solid #b88b40;background:
radial-gradient(circle at 50% 15%,#241a0f,#090807 48%,#030303 100%);position:relative;box-shadow:inset 0 0 0 6px #100d09,0 0 35px #000}
.card-inner:before{content:"";position:absolute;inset:13px;border:1px solid #74572c;pointer-events:none}
.orn{font-size:30px;text-align:center;line-height:1;color:#d4ac5b;margin-bottom:18px}
.small{font-family:Cairo,sans-serif;font-size:15px;line-height:2;text-align:center;color:#e5cc93}
.title{text-align:center;font-size:24px;font-weight:700;margin:18px 0 5px;color:#e7c77b}
.names{text-align:center;font-size:54px;line-height:1.35;color:#f0d48e;text-shadow:0 2px 12px #000;margin:10px 0}
.and{font-size:24px;color:#c99c50}
.line{height:1px;background:linear-gradient(90deg,transparent,#b98a3d,transparent);margin:18px 0}
.info{text-align:center;font-family:Cairo,sans-serif;color:#ead5a5;line-height:2.1;font-size:16px}
.date{font-size:25px;font-family:Georgia,serif;color:#f0d38a;direction:ltr;margin:4px 0}
.place{margin-top:8px}
.close{position:fixed;top:13px;left:13px;width:42px;height:42px;border-radius:50%;border:1px solid #b88b40;background:#0b0907;color:#e7c77b;z-index:20;font-size:24px;cursor:pointer}
.footer{margin-top:25px;text-align:center;font-size:18px;color:#d9b970}
@media(max-width:390px){.envelope{height:255px}.names{font-size:46px}.card-inner{padding-left:18px;padding-right:18px}}

.open-toggle{position:absolute;opacity:0;width:1px;height:1px}
.open-toggle:checked ~ #cover{display:none}
.open-toggle:checked ~ #card{display:block}
.open-fallback{display:block;text-align:center;margin:18px auto 0;padding:12px 28px;border:1px solid #b88b40;border-radius:999px;background:#0b0907;color:#e7c77b;font-family:Cairo,sans-serif;font-size:16px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.envelope{display:block;width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.close{display:flex;align-items:center;justify-content:center;text-decoration:none}
</style>
</head>
<body>
<input class="open-toggle" id="openToggle" type="checkbox" aria-label="فتح الدعوة">
<section class="page" id="cover">
  <div class="wrap">
    <label class="envelope" for="openToggle" aria-label="المس لفتح الدعوة">
      <span class="body"></span>
      <span class="ribbon"></span>
      <span class="flap"></span>
      <span class="seal">♥</span>
    </label>
    <div class="hint">المس الظرف لفتح الدعوة ✨</div>
    <label class="open-fallback" for="openToggle">فتح الدعوة</label>
  </div>
</section>

<section class="card" id="card">
  <label class="close" for="openToggle" aria-label="إغلاق">×</label>
  <div class="card-inner">
    <div class="orn">✦ ❧ ✦</div>
    <div class="small">بكل حبٍ وامتنان</div>
    <div class="title">نتشرف بدعوتكم لحضور</div>
    <div class="title">خطوبة وعقد قران</div>
    <div class="names">الاء <span class="and">و</span> حسن</div>
    <div class="line"></div>
    <div class="small">نبدأ أجمل فصول حياتنا معًا<br>ونتشرف بمشاركتكم فرحتنا</div>
    <div class="line"></div>
    <div class="info">
      <div>الجمعة</div>
      <div class="date">16 / 10 / 2026</div>
      <div>في تمام الساعة <b>5:00 مساءً</b></div>
      <div class="place">📍 ديالى – شفته<br>شارع المفوضية – بيت سيد صلاح</div>
    </div>
    <div class="line"></div>
    <div class="footer">حضوركم شرف لنا 🤍</div>
    <div class="orn" style="margin-top:22px">❧ ✦ ❧</div>
  </div>
</section>


</body>
</html>
